name: Loop agent

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Agent runtime (opencode or cursor). Empty uses loop/agent.json."
        required: false
        default: ""
      model:
        description: "provider/model id. Empty uses loop/agent.json."
        required: false
        default: ""
      dry_run:
        description: "Print the command and fallback chain without calling a model."
        type: boolean
        default: true

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      AGENT_RUNTIME: ${{ inputs.runtime }}
      AGENT_MODEL: ${{ inputs.model }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run the selected runtime and model
        if: ${{ inputs.dry_run }}
        run: npm run loop:agent -- --dry-run --prompt-file loop/prompts/ping.md

      - name: Install OpenCode CLI
        if: ${{ !inputs.dry_run }}
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Cursor CLI
        if: ${{ !inputs.dry_run }}
        run: |
          curl -fsSL https://cursor.com/install | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run loop agent
        if: ${{ !inputs.dry_run }}
        run: npm run loop:agent -- --prompt-file loop/prompts/ping.md
