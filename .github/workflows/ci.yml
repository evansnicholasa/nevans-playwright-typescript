name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Start demo stack
        run: docker compose up -d --wait --build

      - name: Install dependencies
        run: npm ci

      - name: Run loop-agent unit tests
        run: npm run test:loop

      - name: Dry-run story-to-cases from fixture
        run: npm run loop:cases -- --dry-run --issue-file loop/fixtures/ord-1.issue.json

      - name: Check ORD-1 case coverage
        run: npm run loop:coverage -- --cases-file loop/fixtures/ord-1.cases.yaml

      - name: Dry-run cases-to-gherkin from fixture
        run: npm run loop:automate -- --dry-run --cases-file loop/fixtures/ord-1.cases.yaml

      - name: Dry-run failure-to-bug from fixture
        run: npm run loop:bugs -- --dry-run --report-file loop/fixtures/failed-ord-1.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore

      - name: Upload traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
