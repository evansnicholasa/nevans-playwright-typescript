<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders demo</title>
    <style>
      :root {
        font-family: Segoe UI, system-ui, sans-serif;
        color: #1a1a1a;
        background: #f4f1ea;
      }
      body {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      form,
      .panel {
        background: #fff;
        border: 1px solid #ddd4c4;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.2rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.45rem 0.5rem;
      }
      button {
        margin-top: 0.8rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }
      .error {
        color: #9b1c1c;
        min-height: 1.2rem;
      }
      li {
        margin: 0.35rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Orders</h1>
    <p>Create an order. It is stored in Postgres and published to RabbitMQ.</p>

    <form id="order-form" data-testid="order-form">
      <label for="customer">Customer</label>
      <input id="customer" name="customer" data-testid="customer-input" autocomplete="off" />

      <label for="item">Item</label>
      <input id="item" name="item" data-testid="item-input" autocomplete="off" />

      <button type="submit" data-testid="submit-order">Create order</button>
      <p class="error" data-testid="form-error" id="form-error"></p>
    </form>

    <section class="panel">
      <h2>Recent orders</h2>
      <ul id="order-list" data-testid="order-list"></ul>
    </section>

    <script>
      const form = document.getElementById("order-form");
      const errorEl = document.getElementById("form-error");
      const listEl = document.getElementById("order-list");

      async function loadOrders() {
        const res = await fetch("/api/orders");
        const orders = await res.json();
        listEl.innerHTML = "";
        for (const order of orders) {
          const li = document.createElement("li");
          li.dataset.testid = "order-row";
          li.dataset.orderId = String(order.id);
          li.textContent = `#${order.id} ${order.customer} ordered ${order.item}`;
          listEl.appendChild(li);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.textContent = "";
        const customer = document.getElementById("customer").value.trim();
        const item = document.getElementById("item").value.trim();
        if (!customer || !item) {
          errorEl.textContent = "Customer and item are required";
          return;
        }
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ customer, item }),
        });
        const body = await res.json();
        if (!res.ok) {
          errorEl.textContent = body.error || "Could not create order";
          return;
        }
        form.reset();
        await loadOrders();
      });

      loadOrders();
    </script>
  </body>
</html>
